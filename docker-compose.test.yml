services:
  # Test MariaDB Database (matches production: MariaDB 11.8)
  mysql-test:
    image: mariadb:11.8
    container_name: mysql-test
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=test_root_pass
      - MYSQL_DATABASE=cefr_practice_test
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_pass
    volumes:
      # Use updated schema_dump.sql and seed data
      - ./database/schema_dump.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/test_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - mysql_test_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Test Backend API
  backend-test:
    build: .
    container_name: backend-test
    ports:
      - "8001:80"
    env_file:
      - .env.test
    environment:
      - MYSQL_HOST=mysql-test
      - MYSQL_PORT=3306
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_pass
      - MYSQL_DATABASE=cefr_practice_test
      - ENVIRONMENT=test
      - ENABLE_SWAGGER_DOCS=true
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - test-network
    command: >
      uvicorn app.api_main:app
      --host 0.0.0.0
      --port 80
      --reload

networks:
  test-network:
    driver: bridge

volumes:
  mysql_test_data:
