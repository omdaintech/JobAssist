[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
markers =
    auth: Authentication tests
    sessions: Session management tests
    payments: Payment tests
    profile: User profile tests
    workflow: End-to-end workflow tests
    database: Database layer tests
    slow: Slow tests (e.g. real LLM calls)

